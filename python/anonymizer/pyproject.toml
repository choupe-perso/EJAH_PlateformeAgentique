[project]
name = "anonymizer"
version = "1.0.0"
description = "Agent d'anonymisation reversible"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "spacy>=3.8",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "rapidocr-onnxruntime>=1.2",
    "Pillow>=10",
]

[project.scripts]
anonymizer = "anonymizer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
