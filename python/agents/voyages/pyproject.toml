[project]
name = "ejah-agent-voyages-core"
version = "1.0.0"
description = "Agent EJAH personnel - coeur seul (sans CLI ni installeur) - calendrier .ics des voyages SNCF a venir"
requires-python = ">=3.11"
authors = [{ name = "Cedric HOUPE" }]
license = { text = "Usage personnel. Reproduction a l'identique interdite sans autorisation." }
dependencies = [
    "keyring>=25",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
